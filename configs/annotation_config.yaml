model: "PaddleDetection/RT-DETR/rtdetr_r50vd_6x_coco"
num_classes: 28

data: "configs/data.yaml"
batch_size: 16
epochs: 100
learning_rate: 0.0001
weight_decay: 0.0001
min_lr: 0.000001
num_workers: 4
save_interval: 10
gradient_clip: 1.0

validation:
  interval: 5
  confidence_threshold: 0.5
  iou_threshold: 0.45

output_dir: "weights"

augmentation:
  enabled: true
  horizontal_flip: 0.5
  vertical_flip: 0.0
  rotation: 15
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.1

classes:
  0: "person"
  1: "car"
  2: "truck"
  3: "bus"
  4: "motorcycle"
  5: "bicycle"
  6: "boat"
  7: "airplane"
  8: "train"
  9: "building"
  10: "road"
  11: "bridge"
  12: "traffic_light"
  13: "traffic_sign"
  14: "tree"
  15: "pole"
  16: "fence"
  17: "power_line"
  18: "tower"
  19: "container"
  20: "crane"
  21: "excavator"
  22: "bulldozer"
  23: "tractor"
  24: "drone"
  25: "helicopter"
  26: "animal"
  27: "other"